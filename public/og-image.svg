<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EDE2"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0E3B2E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Orbit Ellipses matching site brand -->
  <ellipse cx="600" cy="315" rx="550" ry="260" fill="none" stroke="#0E3B2E" stroke-width="1.5" stroke-opacity="0.25"/>
  <ellipse cx="600" cy="315" rx="460" ry="210" fill="none" stroke="#0E3B2E" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="1060" cy="315" r="14" fill="#FF5C1A"/>

  <!-- Card container -->
  <g transform="translate(100, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="#0E3B2E"/>
    <circle cx="20" cy="19" r="5" fill="#25D366"/>
    <text x="36" y="24" fill="#F4EDE2" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SOFTWARE ENGINEER · JAKARTA</text>

    <!-- Main Name -->
    <text x="0" y="125" fill="#0E3B2E" font-family="'Times New Roman', serif" font-size="64" font-weight="bold" letter-spacing="-1">Husni Zayyin Ansori</text>

    <!-- Subtitle / Title -->
    <text x="0" y="180" fill="#FF5C1A" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700">Senior Software Engineer &amp; Full Stack Architect</text>

    <!-- Description -->
    <text x="0" y="235" fill="#3D4D44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">
      5+ Years Experience · Frontend (React/Next.js) · Mobile (Flutter/Kotlin) · Backend Architecture
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="100" height="34" rx="8" fill="#FFFFFF" stroke="#D3CBC0"/>
      <text x="50" y="22" text-anchor="middle" fill="#0E3B2E" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Next.js</text>

      <rect x="112" y="0" width="96" height="34" rx="8" fill="#FFFFFF" stroke="#D3CBC0"/>
      <text x="160" y="22" text-anchor="middle" fill="#0E3B2E" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Flutter</text>

      <rect x="220" y="0" width="115" height="34" rx="8" fill="#FFFFFF" stroke="#D3CBC0"/>
      <text x="277" y="22" text-anchor="middle" fill="#0E3B2E" font-family="system-ui, sans-serif" font-size="14" font-weight="600">TypeScript</text>

      <rect x="347" y="0" width="115" height="34" rx="8" fill="#FFFFFF" stroke="#D3CBC0"/>
      <text x="404" y="22" text-anchor="middle" fill="#0E3B2E" font-family="system-ui, sans-serif" font-size="14" font-weight="600">PostgreSQL</text>

      <rect x="474" y="0" width="95" height="34" rx="8" fill="#FFFFFF" stroke="#D3CBC0"/>
      <text x="521" y="22" text-anchor="middle" fill="#0E3B2E" font-family="system-ui, sans-serif" font-size="14" font-weight="600">React</text>

      <rect x="581" y="0" width="95" height="34" rx="8" fill="#FFFFFF" stroke="#D3CBC0"/>
      <text x="628" y="22" text-anchor="middle" fill="#0E3B2E" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Laravel</text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="365" fill="#0E3B2E" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
      husnizayyin.github.io · github.com/husnizayyin · @husnizayn
    </text>
  </g>
</svg>
